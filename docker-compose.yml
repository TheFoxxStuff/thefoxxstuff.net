services:
  mongodb:
    image: mongo:7
    container_name: thefoxxstuff-mongo
    restart: unless-stopped
    # Ограничение WiredTiger cache = 256MB (по умолчанию Mongo берёт 50% RAM = 1GB!)
    command: mongod --wiredTigerCacheSizeGB 0.25
    volumes:
      - mongodb_data:/data/db
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          memory: 512m

  redis:
    image: redis:7-alpine
    container_name: thefoxxstuff-redis
    restart: unless-stopped
    command: >
      redis-server
      --maxmemory 64mb
      --maxmemory-policy allkeys-lru
      --save ""
      --appendonly no
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "2"
    deploy:
      resources:
        limits:
          memory: 80m

  backend:
    build: ./backend
    container_name: thefoxxstuff-api
    restart: unless-stopped
    user: "1001:1001"
    depends_on:
      - mongodb
      - redis
    volumes:
      - uploads_data:/app/uploads
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      - MONGODB_URL=mongodb://mongodb:27017
      - DATABASE_NAME=thefoxxstuff
      - SECRET_KEY=${SECRET_KEY}
      - FRONTEND_URL=https://thefoxxstuff.net
      - REDIS_URL=redis://redis:6379/0
      - LOG_LEVEL=INFO
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          memory: 256m

  frontend:
    build:
      context: ./frontend
      args:
        - VITE_API_BASE=https://api.thefoxxstuff.net/api
    container_name: thefoxxstuff-front
    restart: unless-stopped
    volumes:
      - ./frontend/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "127.0.0.1:3000:80"
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "2"
    deploy:
      resources:
        limits:
          memory: 64m

volumes:
  mongodb_data:
  uploads_data: