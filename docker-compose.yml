services:
  # MongoDB Database
  mongodb:
    image: mongo:7
    container_name: thefoxxstuff-mongo
    restart: unless-stopped
    volumes:
      - mongodb_data:/data/db

  # Backend API
  backend:
    build: ./backend
    container_name: thefoxxstuff-api
    restart: unless-stopped
    depends_on:
      - mongodb
    volumes:
      - uploads_data:/app/uploads
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      - MONGODB_URL=mongodb://mongodb:27017
      - DATABASE_NAME=thefoxxstuff
      - SECRET_KEY=${SECRET_KEY}
      - FRONTEND_URL=https://front.thefoxxstuff.net

  # Frontend (build separately with: npm run build)
  frontend:
    image: nginx:alpine
    container_name: thefoxxstuff-front
    restart: unless-stopped
    volumes:
      - ./frontend/build:/usr/share/nginx/html:ro
      - ./frontend/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "127.0.0.1:3000:80"

volumes:
  mongodb_data:
  uploads_data:
