# ─── Разрешённые origins для CORS ────────────────────────────────────────────
# Проверяем Origin и ставим переменную — безопасно, без wildcard
map $http_origin $cors_origin {
    default                           "";
    "https://thefoxxstuff.net"        $http_origin;
    "https://www.thefoxxstuff.net"    $http_origin;
    "https://front.thefoxxstuff.net"  $http_origin;
    "https://dev.thefoxxstuff.net"    $http_origin;
    "http://dev.thefoxxstuff.net"     $http_origin;
    "http://localhost:5173"           $http_origin;
    "http://localhost:4173"           $http_origin;
    "http://127.0.0.1:5173"           $http_origin;
}

# ─── Frontend ─────────────────────────────────────────────────────────────────
server {
    listen 80;
    # FIX: добавлены dev и www домены
    server_name thefoxxstuff.net www.thefoxxstuff.net front.thefoxxstuff.net dev.thefoxxstuff.net;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host       $host;
        proxy_set_header X-Real-IP  $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }
}

# ─── API ──────────────────────────────────────────────────────────────────────
server {
    listen 80;
    server_name api.thefoxxstuff.net;

    client_max_body_size 200M;

    # ── WebSocket для presence ────────────────────────────────────────────────
    location /api/presence/ws {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host       $host;
        proxy_set_header X-Real-IP  $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout    300s;
        proxy_send_timeout    300s;
        proxy_connect_timeout 10s;
        proxy_buffering off;
    }

    # ── Статические файлы (аудио, изображения) ────────────────────────────────
    # FIX: отдельный location для upload/file — nginx отдаёт напрямую,
    # поэтому CORS заголовки нужно добавить здесь явно
    location /api/upload/file/ {

        # OPTIONS preflight — нужно для Chrome Private Network Access
        if ($request_method = 'OPTIONS') {
            add_header 'Access-Control-Allow-Origin'          $cors_origin always;
            add_header 'Access-Control-Allow-Credentials'     'true'       always;
            add_header 'Access-Control-Allow-Methods'         'GET, OPTIONS' always;
            add_header 'Access-Control-Allow-Headers'         'Authorization, Range, Origin' always;
            add_header 'Access-Control-Allow-Private-Network' 'true'       always;
            add_header 'Access-Control-Max-Age'               86400;
            add_header 'Content-Length' 0;
            return 204;
        }

        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host       $host;
        proxy_set_header X-Real-IP  $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # FIX: CORS заголовки на статику
        add_header 'Access-Control-Allow-Origin'          $cors_origin always;
        add_header 'Access-Control-Allow-Credentials'     'true'       always;
        add_header 'Access-Control-Allow-Private-Network' 'true'       always;

        # Кешируем статику на клиенте
        add_header 'Cache-Control' 'public, max-age=31536000' always;

        proxy_read_timeout 60;
        proxy_send_timeout 60;
    }

    # ── Все остальные API запросы ─────────────────────────────────────────────
    location / {

        # OPTIONS preflight
        if ($request_method = 'OPTIONS') {
            add_header 'Access-Control-Allow-Origin'      $cors_origin always;
            add_header 'Access-Control-Allow-Credentials' 'true'       always;
            add_header 'Access-Control-Allow-Methods'     'GET, POST, PUT, DELETE, OPTIONS, PATCH' always;
            add_header 'Access-Control-Allow-Headers'     'Authorization, Content-Type, Accept, Origin' always;
            add_header 'Access-Control-Max-Age'           86400;
            add_header 'Content-Length' 0;
            return 204;
        }

        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host       $host;
        proxy_set_header X-Real-IP  $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # FIX: используем map-переменную — пустой origin не добавляет заголовок
        add_header 'Access-Control-Allow-Origin'      $cors_origin always;
        add_header 'Access-Control-Allow-Credentials' 'true'       always;

        proxy_read_timeout    300;
        proxy_send_timeout    300;
        proxy_connect_timeout 60;
    }

    # ── 429 с CORS ────────────────────────────────────────────────────────────
    error_page 429 = @too_many;
    location @too_many {
        add_header 'Access-Control-Allow-Origin'      $cors_origin always;
        add_header 'Access-Control-Allow-Credentials' 'true'       always;
        add_header 'Content-Type'                     'application/json' always;
        return 429 '{"detail":"Too many requests"}';
    }
}
