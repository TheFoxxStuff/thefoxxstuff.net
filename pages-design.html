<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Music Player Bar</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background-color: #050505; }
        /* Кастомный шрифт для таймера, если нужен закос под засечки */
        .time-font { font-family: Georgia, serif; }
    </style>
</head>
<body class="flex items-center justify-center min-h-screen p-6">

    <div class="relative w-full max-w-5xl bg-[#0a0a0a] border border-white/5 rounded-xl p-3 flex items-center group">
        
        <div class="absolute top-[-1px] left-4 right-4 h-[2px] bg-white/10 rounded-full">
            <div class="relative h-full bg-white/20 w-[40%]">
                <div class="absolute right-0 top-1/2 -translate-y-1/2 w-3 h-3 bg-white rounded-full shadow-[0_0_8px_rgba(255,255,255,0.8)]"></div>
            </div>
        </div>

        <div class="flex flex-col gap-2 px-2 border-r border-white/5 mr-4 py-1">
            <button class="text-white/20 hover:text-white transition-colors">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 5v14M5 12h14"/></svg>
            </button>
            <button class="text-white/20 hover:text-white transition-colors">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6L6 18M6 6l12 12"/></svg>
            </button>
        </div>

        <div class="flex items-center flex-1">
            <div class="w-12 h-12 bg-zinc-900 border border-white/10 rounded-md flex items-center justify-center mr-4 shrink-0">
                <span class="text-white/20 text-xl">?</span>
            </div>
            <div class="min-w-0">
                <h4 class="text-white font-bold text-sm truncate">Sun and Moon</h4>
                <p class="text-white/40 text-[10px] uppercase tracking-widest font-medium truncate">One Soul</p>
            </div>
        </div>

        <div class="flex items-center gap-6 mx-8">
            <button class="text-white/40 hover:text-white transition-colors">
                <svg width="18" height="18" fill="currentColor" viewBox="0 0 24 24"><path d="M6 6h2v12H6zm3.5 6l8.5 6V6z"/></svg>
            </button>
            
            <button class="w-10 h-10 bg-white/5 border border-white/10 rounded-full flex items-center justify-center text-white hover:bg-white/10 transition-all active:scale-90">
                <svg width="16" height="16" fill="currentColor" viewBox="0 0 24 24" class="ml-1"><path d="M8 5v14l11-7z"/></svg>
            </button>

            <button class="text-white/40 hover:text-white transition-colors">
                <svg width="18" height="18" fill="currentColor" viewBox="0 0 24 24"><path d="M6 18l8.5-6L6 6v12zM16 6v12h2V6h-2z"/></svg>
            </button>
        </div>

        <div class="flex items-center gap-6 pr-2">
            <div class="time-font text-white/60 text-sm tracking-wide flex items-center">
                <span>1:31</span>
                <span class="mx-1 opacity-30 text-xs">|</span>
                <span class="opacity-40">3:50</span>
            </div>

            <button class="text-white/30 hover:text-white transition-colors">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 1l4 4-4 4m-12 5l-4-4 4-4m13 13H7a4 4 0 01-4-4V7M7 3h10a4 4 0 014 4v7"/></svg>
            </button>

            <button class="w-9 h-9 bg-white/5 border border-white/5 rounded-lg flex items-center justify-center text-white/40 hover:text-white transition-colors">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M11 5L6 9H2v6h4l5 4V5zM15.54 8.46a5 5 0 010 7.07"/></svg>
            </button>
        </div>

    </div>

</body>
</html>x
