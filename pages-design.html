<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Compact Player — Frame 464</title>
    <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            background: #0d0d0d;
            display: flex; align-items: center; justify-content: center;
            min-height: 100vh;
            font-family: 'Syne', sans-serif;
            overflow: hidden;
        }

        /* DRAG WRAPPER */
        .player-wrap {
            position: fixed;
            user-select: none;
            z-index: 10;
            padding-top: 40px; /* space for tooltips */
        }

        /* FLOATING TOOLTIPS */
        .tooltip-cur,
        .tooltip-end {
            position: absolute;
            top: 4px;
            background: #1a1a1a;
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 6px;
            padding: 2px 8px;
            font-family: 'JetBrains Mono', monospace;
            font-size: 10px;
            font-weight: 500;
            color: #fff;
            pointer-events: none;
            user-select: none;
            white-space: nowrap;
            z-index: 20;
        }
        .tooltip-cur { transform: translateX(-50%); }
        .tooltip-end { transform: translateX(-100%); color: rgba(255,255,255,0.4); }

        /* PLAYER CARD */
        .player-card {
            background: #1c1c1c;
            border: 1px solid rgba(255,255,255,0.07);
            border-radius: 20px;
            box-shadow: 0 4px 6px rgba(0,0,0,.3), 0 20px 60px rgba(0,0,0,.65), inset 0 1px 0 rgba(255,255,255,0.04);
            width: 480px;
            padding: 20px 20px 16px 20px;
            transition: box-shadow 0.25s;
        }
        .player-card.dragging {
            box-shadow: 0 12px 20px rgba(0,0,0,.4), 0 40px 100px rgba(0,0,0,.85), inset 0 1px 0 rgba(255,255,255,0.04);
        }

        @keyframes playerClose {
            0%   { opacity:1; transform:scale(1) translateY(0); }
            35%  { opacity:1; transform:scale(1.015) translateY(-3px); }
            100% { opacity:0; transform:scale(0.88) translateY(14px); }
        }
        .player-wrap.closing {
            animation: playerClose 0.35s cubic-bezier(0.4,0,0.2,1) forwards;
            pointer-events: none;
        }

        /* HEADER: track info (vertical) + actions */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 20px;
        }
        .track-info-vertical {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }
        .track-title {
            font-size: 18px;
            font-weight: 700;
            color: #fff;
            letter-spacing: -0.02em;
            line-height: 1.2;
        }
        .track-artist {
            font-size: 11px;
            font-weight: 600;
            letter-spacing: 0.18em;
            text-transform: uppercase;
            color: rgba(255,255,255,0.35);
            margin-bottom: 8px;
        }
        .time-duo {
            font-family: 'JetBrains Mono', monospace;
            font-size: 13px;
            color: rgba(255,255,255,0.7);
            display: flex;
            gap: 12px;
        }
        .time-duo .dur {
            color: rgba(255,255,255,0.3);
        }

        .action-icons {
            display: flex;
            gap: 8px;
        }
        .icon-btn {
            background: none;
            border: none;
            cursor: pointer;
            color: rgba(255,255,255,0.25);
            display: flex;
            align-items: center;
            justify-content: center;
            width: 30px;
            height: 30px;
            border-radius: 8px;
            transition: color 0.2s, background 0.2s;
        }
        .icon-btn:hover {
            color: rgba(255,255,255,0.8);
            background: rgba(255,255,255,0.05);
        }
        .icon-btn.close-btn:hover { color: #ef4444; }
        .icon-btn svg { width: 16px; height: 16px; }
        .move-btn { cursor: grab; }
        .move-btn:active { cursor: grabbing; }

        /* PROGRESS BAR AREA */
        .progress-area {
            position: relative;
            margin-bottom: 20px;
        }
        .track-bar-wrapper {
            position: relative;
            height: 5px;
        }
        .track-bg {
            position: absolute; inset: 0;
            background: rgba(255,255,255,0.08);
            border-radius: 99px;
            overflow: hidden;
        }
        .track-fill {
            height: 100%; background: #3b82f6;
            border-radius: 99px; width: 39%;
        }
        .track-input {
            position: absolute; top: -8px; left: 0;
            width: 100%; height: 22px;
            opacity: 0; cursor: pointer; z-index: 2;
        }
        .track-thumb {
            position: absolute; top: 50%;
            transform: translate(-50%, -50%);
            width: 12px; height: 12px;
            background: #fff; border: 2px solid #3b82f6; border-radius: 50%;
            box-shadow: 0 0 8px rgba(59,130,246,0.6);
            pointer-events: none; z-index: 1;
        }

        /* CONTROLS ROW */
        .controls-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .playback-controls {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .ctrl-btn {
            background: none;
            border: none;
            cursor: pointer;
            color: rgba(255,255,255,0.4);
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            transition: color 0.2s, transform 0.1s;
        }
        .ctrl-btn:hover { color: #fff; }
        .ctrl-btn:active { transform: scale(0.9); }
        .ctrl-btn svg { width: 20px; height: 20px; fill: currentColor; }

        .play-btn {
            width: 40px; height: 40px;
            background: rgba(255,255,255,0.08);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 50%;
            color: rgba(255,255,255,0.9);
        }
        .play-btn:hover { background: rgba(255,255,255,0.15); }
        .play-btn svg { width: 16px; height: 16px; }

        /* VOLUME MORPHING POPOVER (compact) */
        .vol-wrap { position: relative; }
        .vol-popover {
            position: absolute;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 52px;
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.09);
            border-radius: 12px;
            padding: 12px 10px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
            cursor: pointer;
            z-index: 100;
            clip-path: inset(calc(100% - 34px) -2px -2px -2px round 10px);
            transition: clip-path 0.4s cubic-bezier(0.34, 1.38, 0.64, 1), background 0.2s, border-color 0.2s;
        }
        .vol-wrap.open .vol-popover {
            clip-path: inset(-2px -2px -2px -2px round 18px);
            background: #1a1a1a;
            border-color: rgba(255,255,255,0.1);
            box-shadow: 0 20px 40px rgba(0,0,0,0.7);
            cursor: default;
        }
        .vol-value, .vol-track {
            opacity: 0;
            transform: translateY(8px);
            transition: opacity 0.2s ease, transform 0.25s cubic-bezier(0.34,1.56,0.64,1);
            pointer-events: none;
        }
        .vol-wrap.open .vol-value {
            opacity: 1; transform: none;
            transition-delay: 0.1s;
        }
        .vol-wrap.open .vol-track {
            opacity: 1; transform: none;
            transition-delay: 0.15s;
            pointer-events: auto;
        }
        .vol-value {
            font-family: 'JetBrains Mono', monospace;
            font-size: 11px;
            font-weight: 600;
            color: rgba(255,255,255,0.6);
        }
        .vol-track {
            position: relative;
            width: 3px; height: 90px;
            background: rgba(255,255,255,0.1);
            border-radius: 99px;
        }
        .vol-fill {
            position: absolute; bottom:0; left:0;
            width: 100%; background: #fff;
            border-radius: 99px;
            pointer-events: none;
        }
        .vol-thumb {
            position: absolute; left: 50%;
            width: 12px; height: 12px;
            background: #fff; border-radius: 50%;
            transform: translateX(-50%);
            box-shadow: 0 2px 8px rgba(0,0,0,0.6);
            pointer-events: none;
        }
        .vol-range {
            position: absolute; top:0; left:50%;
            width: 32px; height: 100%;
            transform: translateX(-50%);
            opacity: 0; cursor: pointer;
            writing-mode: vertical-lr; direction: rtl;
            -webkit-appearance: slider-vertical;
        }
        .vol-icon {
            color: rgba(255,255,255,0.4);
            display: flex;
            align-items: center;
            justify-content: center;
            width: 16px; height: 16px;
            transition: color 0.2s;
        }
        .vol-wrap.open .vol-icon { color: rgba(255,255,255,0.25); }
        .vol-icon svg { width: 16px; height: 16px; }
    </style>
</head>
<body>
    <div class="player-wrap" id="player-wrap">
        <!-- Tooltips (outside card) -->
        <div class="tooltip-cur" id="tooltip-cur">01:30</div>
        <div class="tooltip-end" id="tooltip-end">03:50</div>

        <div class="player-card" id="player-card">
            <!-- Header: vertical track info + actions -->
            <div class="header">
                <div class="track-info-vertical">
                    <div class="track-title">Sun and Moon</div>
                    <div class="track-artist">ONE SOUL</div>
                    <div class="time-duo" id="time-duo">
                        <span id="time-cur-display">01:30</span>
                        <span class="dur" id="time-dur-display">03:50</span>
                    </div>
                </div>
                <div class="action-icons">
                    <button class="icon-btn move-btn" id="move-btn" title="Drag">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <polyline points="5 9 2 12 5 15"/><polyline points="9 5 12 2 15 5"/>
                            <polyline points="15 19 12 22 9 19"/><polyline points="19 9 22 12 19 15"/>
                            <line x1="2" y1="12" x2="22" y2="12"/><line x1="12" y1="2" x2="12" y2="22"/>
                        </svg>
                    </button>
                    <button class="icon-btn close-btn" id="close-btn" title="Close">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/>
                        </svg>
                    </button>
                </div>
            </div>

            <!-- Progress bar -->
            <div class="progress-area">
                <div class="track-bar-wrapper" id="track-bar">
                    <div class="track-bg">
                        <div class="track-fill" id="track-fill"></div>
                    </div>
                    <div class="track-thumb" id="track-thumb"></div>
                    <input type="range" class="track-input" id="track-input" min="0" max="230" value="90">
                </div>
            </div>

            <!-- Bottom row: playback controls + volume -->
            <div class="controls-row">
                <div class="playback-controls">
                    <button class="ctrl-btn" title="Previous">
                        <svg viewBox="0 0 24 24">
                            <polygon points="19 20 9 12 19 4 19 20"/>
                            <line x1="5" y1="19" x2="5" y2="5" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round"/>
                        </svg>
                    </button>
                    <button class="ctrl-btn play-btn" id="play-btn" title="Play/Pause">
                        <svg viewBox="0 0 24 24" fill="currentColor">
                            <polygon points="6 3 20 12 6 21 6 3"/>
                        </svg>
                    </button>
                    <button class="ctrl-btn" title="Next">
                        <svg viewBox="0 0 24 24">
                            <polygon points="5 4 15 12 5 20 5 4"/>
                            <line x1="19" y1="5" x2="19" y2="19" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round"/>
                        </svg>
                    </button>
                </div>

                <!-- Volume popover (morph) -->
                <div class="vol-wrap" id="vol-wrap">
                    <div class="vol-popover" id="vol-popover">
                        <span class="vol-value" id="vol-label">50</span>
                        <div class="vol-track">
                            <div class="vol-fill" id="vol-fill"></div>
                            <div class="vol-thumb" id="vol-thumb"></div>
                            <input type="range" class="vol-range" id="vol-input" min="0" max="100" value="50">
                        </div>
                        <div class="vol-icon" id="vol-icon">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/>
                                <path d="M19.07 4.93a10 10 0 0 1 0 14.14M15.54 8.46a5 5 0 0 1 0 7.07"/>
                            </svg>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        /* === HELPERS === */
        const TOTAL = 230; // 3:50 = 230 seconds
        function fmt(s) {
            return `${String(Math.floor(s/60)).padStart(2,'0')}:${String(Math.floor(s%60)).padStart(2,'0')}`;
        }

        /* === INIT POSITION (centered) === */
        const wrap = document.getElementById('player-wrap');
        const card = document.getElementById('player-card');

        function initPos() {
            const cardW = 480;
            const wrapH = wrap.offsetHeight;
            wrap.style.left = Math.round((window.innerWidth - cardW) / 2) + 'px';
            wrap.style.top  = Math.round((window.innerHeight - wrapH) / 2) + 'px';
        }
        requestAnimationFrame(() => requestAnimationFrame(initPos));

        /* === DRAG (only from move button) === */
        const moveBtn = document.getElementById('move-btn');
        let dragging = false, dragOffX = 0, dragOffY = 0;

        moveBtn.addEventListener('mousedown', e => {
            e.preventDefault();
            dragging = true;
            const r = wrap.getBoundingClientRect();
            dragOffX = e.clientX - r.left;
            dragOffY = e.clientY - r.top;
            card.classList.add('dragging');
            document.body.style.cursor = 'grabbing';
        });

        document.addEventListener('mousemove', e => {
            if (!dragging) return;
            let nx = e.clientX - dragOffX;
            let ny = e.clientY - dragOffY;
            nx = Math.max(0, Math.min(nx, window.innerWidth - wrap.offsetWidth));
            ny = Math.max(0, Math.min(ny, window.innerHeight - wrap.offsetHeight));
            wrap.style.left = nx + 'px';
            wrap.style.top  = ny + 'px';
            updateTooltipPositions();
        });

        document.addEventListener('mouseup', () => {
            if (!dragging) return;
            dragging = false;
            card.classList.remove('dragging');
            document.body.style.cursor = '';
        });

        // Touch support
        moveBtn.addEventListener('touchstart', e => {
            const t = e.touches[0];
            dragging = true;
            const r = wrap.getBoundingClientRect();
            dragOffX = t.clientX - r.left;
            dragOffY = t.clientY - r.top;
            card.classList.add('dragging');
        }, { passive: true });

        document.addEventListener('touchmove', e => {
            if (!dragging) return;
            const t = e.touches[0];
            let nx = t.clientX - dragOffX;
            let ny = t.clientY - dragOffY;
            nx = Math.max(0, Math.min(nx, window.innerWidth - wrap.offsetWidth));
            ny = Math.max(0, Math.min(ny, window.innerHeight - wrap.offsetHeight));
            wrap.style.left = nx + 'px';
            wrap.style.top  = ny + 'px';
            updateTooltipPositions();
        }, { passive: true });

        document.addEventListener('touchend', () => {
            dragging = false;
            card.classList.remove('dragging');
        });

        /* === CLOSE === */
        document.getElementById('close-btn').addEventListener('click', () => {
            wrap.classList.add('closing');
            wrap.addEventListener('animationend', () => wrap.style.display = 'none', { once: true });
        });

        /* === PROGRESS BAR + TOOLTIPS + TIME DISPLAY === */
        const trackInput  = document.getElementById('track-input');
        const trackFill   = document.getElementById('track-fill');
        const trackThumb  = document.getElementById('track-thumb');
        const tooltipCur  = document.getElementById('tooltip-cur');
        const tooltipEnd  = document.getElementById('tooltip-end');
        const timeCurDisplay = document.getElementById('time-cur-display');
        const trackBar    = document.getElementById('track-bar');

        function updateTooltipPositions() {
            const barRect  = trackBar.getBoundingClientRect();
            const wrapRect = wrap.getBoundingClientRect();
            const barLeft  = barRect.left - wrapRect.left;
            const barWidth = barRect.width;
            const pct = parseFloat(trackFill.style.width) / 100 || 0;
            tooltipCur.style.left = (barLeft + pct * barWidth) + 'px';
            tooltipEnd.style.left = (barLeft + barWidth) + 'px';
        }

        function setProgress(val) {
            const pct = (val / TOTAL) * 100;
            trackFill.style.width = pct + '%';
            trackThumb.style.left = pct + '%';
            const t = fmt(val);
            tooltipCur.textContent = t;
            timeCurDisplay.textContent = t;
            updateTooltipPositions();
        }

        trackInput.addEventListener('input', e => setProgress(+e.target.value));

        requestAnimationFrame(() => {
            requestAnimationFrame(() => {
                setProgress(90); // 01:30
            });
        });

        /* === PLAY / PAUSE === */
        let playing = false, cur = 90, ticker = null;
        const playBtn = document.getElementById('play-btn');

        playBtn.addEventListener('click', () => {
            playing = !playing;
            playBtn.innerHTML = playing
                ? `<svg viewBox="0 0 24 24" fill="currentColor"><rect x="5" y="4" width="4" height="16" rx="1.5"/><rect x="15" y="4" width="4" height="16" rx="1.5"/></svg>`
                : `<svg viewBox="0 0 24 24" fill="currentColor"><polygon points="6 3 20 12 6 21 6 3"/></svg>`;
            if (playing) {
                ticker = setInterval(() => {
                    cur = (cur + 1) % TOTAL;
                    trackInput.value = cur;
                    setProgress(cur);
                }, 1000);
            } else {
                clearInterval(ticker);
            }
        });

        /* === VOLUME === */
        const volWrap  = document.getElementById('vol-wrap');
        const volIcon  = document.getElementById('vol-icon');
        const volPopover = document.getElementById('vol-popover');
        const volInput = document.getElementById('vol-input');
        const volFill  = document.getElementById('vol-fill');
        const volThumb = document.getElementById('vol-thumb');
        const volLabel = document.getElementById('vol-label');
        const TRACK_H  = 90; // height of .vol-track

        let volOpen = false;

        function openVol()  { volOpen = true;  volWrap.classList.add('open'); }
        function closeVol() { volOpen = false; volWrap.classList.remove('open'); }

        volIcon.addEventListener('click', e => {
            e.stopPropagation();
            volOpen ? closeVol() : openVol();
        });

        document.addEventListener('click', e => {
            if (volOpen && !volWrap.contains(e.target)) closeVol();
        });

        volPopover.addEventListener('click', e => e.stopPropagation());

        function setVolume(v) {
            const fillH = (v / 100) * TRACK_H;
            volFill.style.height = Math.max(0, fillH) + 'px';
            volThumb.style.bottom = Math.max(0, fillH - 6) + 'px'; // thumb height/2 offset
            volLabel.textContent = v;
        }

        volInput.addEventListener('input', e => setVolume(+e.target.value));
        setVolume(50);

        /* === RESIZE === */
        window.addEventListener('resize', () => {
            initPos();
            updateTooltipPositions();
        });
    </script>
</body>
</html>
