<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        /* Плавное появление громкости */
        .volume-popover {
            visibility: hidden;
            opacity: 0;
            transform: translateY(10px);
            transition: all 0.2s ease-out;
        }
        .volume-popover.active {
            visibility: visible;
            opacity: 1;
            transform: translateY(0);
        }
        /* Скрытие стандартных инпутов для кастомизации */
        input[type="range"]::-webkit-slider-thumb { appearance: none; width: 12px; height: 12px; }
        input[type="range"]::-moz-range-thumb { border: none; width: 12px; height: 12px; }
    </style>
</head>
<body class="bg-[#0f0f0f] flex items-center justify-center min-h-screen">

    <div class="w-[776px] h-[76px] flex items-center gap-4 p-[6px] rounded-lg border border-white/5 bg-black/90 backdrop-blur-[32px] shadow-[0_4px_18px_rgba(0,0,0,0.32)]">
        
        <div class="flex flex-col justify-between h-full py-1">
            <div class="w-[30px] h-[30px] flex items-center justify-center cursor-pointer group">
                <i data-lucide="move" class="w-5 h-5 text-white/30 group-hover:text-white/60 transition-colors"></i>
            </div>
            <div class="w-[30px] h-[30px] flex items-center justify-center cursor-pointer group">
                <i data-lucide="x" class="w-5 h-5 text-white/30 group-hover:text-[#A61530] transition-colors"></i>
            </div>
        </div>

        <div class="w-[730px] h-[64px] flex flex-col gap-1">
            
            <div class="relative w-full h-1 flex items-center">
                <div class="absolute w-full h-full bg-white/5 rounded-full"></div>
                <div id="mainProgress" class="absolute h-full bg-gradient-to-r from-[#007BFF] to-[#0056b3] rounded-full" style="width: 45%;"></div>
                <input type="range" id="mainSlider" class="absolute w-full h-4 opacity-0 cursor-pointer z-10" min="0" max="100" value="45">
                <div id="mainThumb" class="absolute w-3 h-3 bg-white rounded-full shadow-[-3px_0_12px_rgba(0,0,0,1)] pointer-events-none" style="left: calc(45% - 6px);"></div>
            </div>

            <div class="w-full h-[56px] bg-white/5 rounded flex items-center justify-between px-3 shadow-[-1px_0_12px_rgba(0,0,0,1)]">
                
                <div class="flex items-center gap-2 w-[220px]">
                    <img src="https://via.placeholder.com/48" class="w-12 h-12 rounded-[2px] bg-white/10">
                    <div class="flex flex-col">
                        <span class="text-[14px] font-bold text-white leading-tight">Track Name</span>
                        <span class="text-[10px] text-white/60">Artist Name</span>
                    </div>
                </div>

                <div class="flex items-center gap-1">
                    <div class="w-8 h-8 flex items-center justify-center rounded-lg hover:bg-white/5 cursor-pointer group">
                        <i data-lucide="skip-back" class="w-5 h-5 fill-white/60 text-white/60 group-hover:fill-white group-hover:text-white"></i>
                    </div>
                    <div class="w-10 h-10 flex items-center justify-center rounded-full bg-white/10 hover:bg-white/20 cursor-pointer">
                        <i data-lucide="play" class="w-5 h-5 fill-white text-white ml-0.5"></i>
                    </div>
                    <div class="w-8 h-8 flex items-center justify-center rounded-lg hover:bg-white/5 cursor-pointer group">
                        <i data-lucide="skip-forward" class="w-5 h-5 fill-white/60 text-white/60 group-hover:fill-white group-hover:text-white"></i>
                    </div>
                </div>

                <div class="flex items-center gap-[6px] w-[220px] justify-end">
                    <span class="text-[12px] text-white/60">01:30</span>
                    <div class="h-3 w-[1px] bg-white/10 mx-1"></div>
                    <span class="text-[12px] text-white/60">03:50</span>
                    
                    <div class="relative flex flex-col items-center">
                        <div id="volumeMenu" class="volume-popover absolute bottom-[calc(100%+12px)] flex flex-col items-center gap-4 p-1 pt-2 rounded-lg bg-black backdrop-blur-[32px] shadow-[0_4px_4px_rgba(0,0,0,0.25)] border border-white/5 w-10">
                            <span id="volVal" class="text-[14px] text-white/60 font-regular">60</span>
                            <div class="relative w-1 h-[100px] flex flex-col items-center mb-1">
                                <div class="absolute w-full h-full bg-white/5 rounded-full"></div>
                                <div id="volFill" class="absolute bottom-0 w-full bg-white rounded-full" style="height: 60%;"></div>
                                <input type="range" id="volSlider" orientation="vertical" min="0" max="100" value="60" class="absolute inset-0 w-full h-full opacity-0 cursor-pointer z-10 [writing-mode:bt-lr]">
                                <div id="volThumb" class="absolute left-1/2 -translate-x-1/2 w-3 h-3 bg-white rounded-full shadow-[-3px_0_12px_rgba(0,0,0,1)] pointer-events-none" style="bottom: calc(60% - 6px);"></div>
                            </div>
                        </div>
                        <div id="volBtn" class="w-8 h-8 flex items-center justify-center rounded-lg hover:bg-white/5 cursor-pointer group transition-all">
                            <i data-lucide="volume-2" class="w-5 h-5 text-white/60 group-hover:text-white"></i>
                        </div>
                    </div>

                    <div class="w-8 h-8 flex items-center justify-center rounded-lg hover:bg-white/5 cursor-pointer group">
                        <i data-lucide="repeat-2" class="w-5 h-5 text-white/60 group-hover:text-white"></i>
                    </div>
                </div>

            </div>
        </div>
    </div>

    <script>
        lucide.createIcons();

        // Логика главного слайдера (Синий)
        const mainSlider = document.getElementById('mainSlider');
        const mainProgress = document.getElementById('mainProgress');
        const mainThumb = document.getElementById('mainThumb');

        mainSlider.addEventListener('input', (e) => {
            const val = e.target.value;
            mainProgress.style.width = val + '%';
            mainThumb.style.left = `calc(${val}% - 6px)`;
        });

        // Логика громкости
        const volBtn = document.getElementById('volBtn');
        const volumeMenu = document.getElementById('volumeMenu');
        const volSlider = document.getElementById('volSlider');
        const volFill = document.getElementById('volFill');
        const volThumb = document.getElementById('volThumb');
        const volVal = document.getElementById('volVal');

        // Открытие по клику
        volBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            volumeMenu.classList.toggle('active');
        });

        // Работа вертикального ползунка
        volSlider.addEventListener('input', (e) => {
            const val = e.target.value;
            volFill.style.height = val + '%';
            volThumb.style.bottom = `calc(${val}% - 6px)`;
            volVal.textContent = val;
        });

        // Закрытие при клике мимо
        document.addEventListener('click', (e) => {
            if (!volumeMenu.contains(e.target)) volumeMenu.classList.remove('active');
        });
    </script>
</body>
</html>
