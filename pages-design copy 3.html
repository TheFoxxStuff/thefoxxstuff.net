<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;700&display=swap');
        body { font-family: 'Inter', sans-serif; }
    </style>
</head>
<body class="bg-[#0f0f0f] flex items-center justify-center min-h-screen">

    <div class="w-[776px] h-[76px] flex items-center gap-4 p-[6px] rounded-lg border border-white/5 bg-black/90 backdrop-blur-[32px] shadow-[0_4px_18px_rgba(0,0,0,0.32)]">
        
        <div class="flex flex-col justify-between h-full py-1 min-w-[30px]">
            <div class="w-[30px] h-[30px] flex items-center justify-center cursor-pointer group">
                <i data-lucide="move" class="w-5 h-5 text-white/30 group-hover:text-white/60 transition-colors"></i>
            </div>
            <div class="w-[30px] h-[30px] flex items-center justify-center cursor-pointer group">
                <i data-lucide="x" class="w-5 h-5 text-white/30 group-hover:text-[#A61530] transition-colors"></i>
            </div>
        </div>

        <div class="w-[730px] h-[64px] flex flex-col gap-1">
            
            <div class="relative w-full h-1 flex items-center group cursor-pointer">
                <div class="absolute w-full h-full bg-white/5 rounded-full"></div>
                <div class="absolute w-[45%] h-full bg-gradient-to-r from-[#007BFF] to-[#0056b3] rounded-full"></div>
                <div class="absolute left-[45%] -translate-x-1/2 w-3 h-3 bg-white rounded-full shadow-[-3px_0_12px_rgba(0,0,0,1)]"></div>
            </div>

            <div class="w-full h-[56px] bg-white/5 rounded flex items-center justify-between px-3 shadow-[-1px_0_12px_rgba(0,0,0,1)]">
                
                <div class="flex items-center gap-2 min-w-[180px]">
                    <img src="https://via.placeholder.com/48" alt="Avatar" class="w-12 h-12 rounded-[2px] object-cover">
                    <div class="flex flex-col justify-center">
                        <span class="text-[14px] font-bold text-white leading-tight">Заголовок трека</span>
                        <span class="text-[10px] font-normal text-white/60 leading-tight">Исполнитель</span>
                    </div>
                </div>

                <div class="flex items-center gap-1">
                    <div class="w-8 h-8 flex items-center justify-center rounded-lg hover:bg-white/5 cursor-pointer transition-all group">
                        <i data-lucide="skip-back" class="w-5 h-5 fill-white/60 text-white/60 group-hover:fill-white group-hover:text-white transition-colors"></i>
                    </div>

                    <div class="w-10 h-10 flex items-center justify-center rounded-full bg-white/10 hover:bg-white/20 cursor-pointer transition-all group">
                        <i data-lucide="play" class="w-5 h-5 fill-white text-white ml-0.5"></i>
                    </div>

                    <div class="w-8 h-8 flex items-center justify-center rounded-lg hover:bg-white/5 cursor-pointer transition-all group">
                        <i data-lucide="skip-forward" class="w-5 h-5 fill-white/60 text-white/60 group-hover:fill-white group-hover:text-white transition-colors"></i>
                    </div>
                </div>

                <div class="flex items-center gap-[6px] min-w-[180px] justify-end">
                    <span class="text-[12px] text-white/60">01:30</span>
                    <div class="h-3 w-[1px] bg-white/10 mx-1"></div>
                    <span class="text-[12px] text-white/60">03:50</span>
                    
<div x-data="{ open: false }" class="relative flex flex-col items-center">
    
    <div 
        x-show="open" 
        x-transition:enter="transition ease-out duration-200"
        x-transition:enter-start="opacity-0 translate-y-2 scale-95"
        x-transition:enter-end="opacity-100 translate-y-0 scale-100"
        x-transition:leave="transition ease-in duration-150"
        x-transition:leave-start="opacity-100 translate-y-0 scale-100"
        x-transition:leave-end="opacity-0 translate-y-2 scale-95"
        class="absolute bottom-0 mb-[-6px] flex flex-col items-center bg-black/90 backdrop-blur-[32px] p-1 pt-2 rounded-lg shadow-[0_4px_4px_rgba(0,0,0,0.25)] border border-white/5 z-50"
        @click.away="open = false"
    >
        <div class="relative w-1 h-[100px] mb-2 flex flex-col-reverse items-center group/slider cursor-pointer">
            <div class="absolute w-full h-full bg-white/5 rounded-full"></div>
            <div class="absolute w-full h-[60%] bg-white rounded-full"></div>
            <div class="absolute bottom-[60%] mb-[-6px] w-3 h-3 bg-white rounded-full shadow-[-3px_0_12px_rgba(0,0,0,1)] z-10"></div>
        </div>

        <div class="w-8 h-8 flex items-center justify-center rounded-lg hover:bg-white/5 cursor-pointer group" @click="open = false">
            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-volume-2 w-5 h-5 text-white group-hover:text-white transition-colors">
                <path d="M11 4.702a.705.705 0 0 0-1.203-.498L6.413 7.587A1.4 1.4 0 0 1 5.416 8H3a1 1 0 0 0-1 1v6a1 1 0 0 0 1 1h2.416a1.4 1.4 0 0 1 .997.413l3.383 3.384A.705.705 0 0 0 11 19.298z"></path>
                <path d="M16 9a5 5 0 0 1 0 6"></path>
                <path d="M19.364 18.364a9 9 0 0 0 0-12.728"></path>
            </svg>
        </div>
    </div>

    <div 
        x-show="!open" 
        @click="open = true"
        class="w-8 h-8 flex items-center justify-center rounded-lg hover:bg-white/5 cursor-pointer group transition-all"
    >
        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-volume-2 w-5 h-5 text-white/60 group-hover:text-white transition-colors">
            <path d="M11 4.702a.705.705 0 0 0-1.203-.498L6.413 7.587A1.4 1.4 0 0 1 5.416 8H3a1 1 0 0 0-1 1v6a1 1 0 0 0 1 1h2.416a1.4 1.4 0 0 1 .997.413l3.383 3.384A.705.705 0 0 0 11 19.298z"></path>
            <path d="M16 9a5 5 0 0 1 0 6"></path>
            <path d="M19.364 18.364a9 9 0 0 0 0-12.728"></path>
        </svg>
    </div>
</div>

                    <div class="w-8 h-8 flex items-center justify-center rounded-lg hover:bg-white/5 cursor-pointer group">
                        <i data-lucide="repeat-2" class="w-5 h-5 text-white/60 group-hover:text-white transition-colors"></i>
                    </div>
                </div>

            </div>
        </div>
    </div>

    <script>
        lucide.createIcons();
    </script>
</body>
</html>
