<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script defer src="https://unpkg.com/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;700&display=swap');
        body { 
            font-family: 'Inter', sans-serif; 
            overflow: hidden; 
        }
        
        .volume-slider {
            writing-mode: bt-lr;
            -webkit-appearance: slider-vertical;
            appearance: slider-vertical;
            width: 100%;
            height: 100%;
            opacity: 0;
            cursor: pointer;
            z-index: 30;
        }
    </style>
</head>
<body class="bg-[#0f0f0f] flex items-center justify-center min-h-screen">

    <div class="w-[776px] h-[76px] flex items-center gap-4 p-[6px] rounded-lg border border-white/5 bg-black/90 backdrop-blur-[32px] shadow-[0_4px_18px_rgba(0,0,0,0.32)]">
        
        <!-- Левая колонка -->
        <div class="flex flex-col justify-between h-full py-1 min-w-[30px]">
            <div class="w-[30px] h-[30px] flex items-center justify-center cursor-pointer group">
                <i data-lucide="move" class="w-5 h-5 text-white/30 group-hover:text-white/60 transition-colors"></i>
            </div>
            <div class="w-[30px] h-[30px] flex items-center justify-center cursor-pointer group">
                <i data-lucide="x" class="w-5 h-5 text-white/30 group-hover:text-[#A61530] transition-colors"></i>
            </div>
        </div>

        <div x-data="{ progress: 45, volume: 65, volumeOpen: false }" class="w-[730px] h-[64px] flex flex-col gap-1">
            
            <!-- Прогресс трека -->
            <div class="relative w-full h-1 flex items-center group cursor-pointer">
                <div class="absolute w-full h-full bg-white/5 rounded-full"></div>
                <div class="absolute h-full bg-gradient-to-r from-[#007BFF] to-[#0056b3] rounded-full" :style="`width: ${progress}%`"></div>
                <input type="range" min="0" max="100" x-model="progress" class="absolute w-full h-4 opacity-0 cursor-pointer z-10">
                <div class="absolute w-3 h-3 bg-white rounded-full shadow-[-3px_0_12px_rgba(0,0,0,1)] pointer-events-none" :style="`left: ${progress}%`; transform: translateX(-50%);"></div>
            </div>

            <!-- Основная панель -->
            <div class="w-full h-[56px] bg-white/5 rounded flex items-center justify-between px-3 shadow-[-1px_0_12px_rgba(0,0,0,1)]">
                
                <!-- Трек -->
                <div class="flex items-center gap-2 min-w-[180px]">
                    <img src="https://via.placeholder.com/48" alt="Avatar" class="w-12 h-12 rounded-[2px] object-cover">
                    <div class="flex flex-col justify-center">
                        <span class="text-[14px] font-bold text-white leading-tight">Заголовок трека</span>
                        <span class="text-[10px] font-normal text-white/60 leading-tight">Исполнитель</span>
                    </div>
                </div>

                <!-- Кнопки воспроизведения -->
                <div class="flex items-center gap-1">
                    <div class="w-8 h-8 flex items-center justify-center rounded-lg hover:bg-white/5 cursor-pointer group transition-all">
                        <i data-lucide="skip-back" class="w-5 h-5 fill-white/60 text-white/60 group-hover:fill-white group-hover:text-white"></i>
                    </div>
                    <div class="w-10 h-10 flex items-center justify-center rounded-full bg-white/10 hover:bg-white/20 cursor-pointer group transition-all">
                        <i data-lucide="play" class="w-5 h-5 fill-white text-white ml-0.5"></i>
                    </div>
                    <div class="w-8 h-8 flex items-center justify-center rounded-lg hover:bg-white/5 cursor-pointer group transition-all">
                        <i data-lucide="skip-forward" class="w-5 h-5 fill-white/60 text-white/60 group-hover:fill-white group-hover:text-white"></i>
                    </div>
                </div>

                <!-- Время + громкость + repeat -->
                <div class="flex items-center gap-[6px] min-w-[180px] justify-end">
                    <span class="text-[12px] text-white/60">01:30</span>
                    <div class="h-3 w-[1px] bg-white/10 mx-1"></div>
                    <span class="text-[12px] text-white/60">03:50</span>

                    <!-- === ГРОМКОСТЬ — иконка всегда на месте === -->
                    <div class="relative flex flex-col items-center">
                        
                        <!-- Попап появляется СТРОГО НАД иконкой -->
                        <div 
                            x-show="volumeOpen"
                            @click.away="volumeOpen = false"
                            x-transition:enter="transition ease-out duration-200"
                            x-transition:enter-start="opacity-0 translate-y-2 scale-95"
                            x-transition:enter-end="opacity-100 translate-y-0 scale-100"
                            x-transition:leave="transition ease-in duration-150"
                            x-transition:leave-start="opacity-100 translate-y-0 scale-100"
                            x-transition:leave-end="opacity-0 translate-y-2 scale-95"
                            class="absolute bottom-full mb-3 flex flex-col items-center bg-black/95 backdrop-blur-[32px] border border-white/10 rounded-xl shadow-2xl p-3 w-11 z-50">
                            
                            <span class="text-[14px] font-medium text-white/90 mb-2" x-text="volume"></span>
                            
                            <div class="relative w-1 h-[108px] flex flex-col-reverse bg-white/10 rounded-full cursor-pointer overflow-hidden">
                                <div class="absolute bottom-0 w-full bg-white rounded-full transition-all" :style="`height: ${volume}%`"></div>
                                <div class="absolute w-3 h-3 bg-white rounded-full shadow-[-3px_0_12px_rgba(0,0,0,1)] left-1/2 -translate-x-1/2 pointer-events-none transition-all" 
                                     :style="`bottom: ${volume}%; margin-bottom: -6px;`"></div>
                                <input type="range" min="0" max="100" x-model="volume" class="volume-slider">
                            </div>
                            
                            <div @click="volumeOpen = false" class="mt-2 w-8 h-8 flex items-center justify-center hover:bg-white/10 rounded-lg cursor-pointer">
                                <i data-lucide="volume-2" class="w-5 h-5 text-white"></i>
                            </div>
                        </div>

                        <!-- Основная иконка — ВСЕГДА ВИДНА -->
                        <div 
                            @click="volumeOpen = !volumeOpen"
                            class="w-8 h-8 flex items-center justify-center rounded-lg hover:bg-white/5 cursor-pointer group transition-all">
                            <i data-lucide="volume-2" 
                               class="w-5 h-5 transition-colors"
                               :class="{ 'text-white': volumeOpen, 'text-white/60 group-hover:text-white': !volumeOpen }">
                            </i>
                        </div>
                    </div>

                    <div class="w-8 h-8 flex items-center justify-center rounded-lg hover:bg-white/5 cursor-pointer group">
                        <i data-lucide="repeat-2" class="w-5 h-5 text-white/60 group-hover:text-white transition-colors"></i>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        document.addEventListener('alpine:init', () => {
            lucide.createIcons();
        });
        document.addEventListener('click', () => {
            setTimeout(() => lucide.createIcons(), 30);
        });
    </script>
</body>
</html>
