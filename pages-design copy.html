<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="bg-gray-900 flex items-center justify-center min-h-screen">

    <div class="w-[776px] h-[76px] flex items-center gap-4 p-1.5 rounded-lg border border-white/5 bg-black/90 backdrop-blur-[32px] shadow-[0_4px_18px_rgba(0,0,0,0.32)]">
        
        <div class="flex flex-col justify-between h-full">
            <div class="w-[30px] h-[30px] flex items-center justify-center cursor-pointer group">
                <i data-lucide="move" class="w-5 h-5 text-white/30 group-hover:text-white/60 transition-colors"></i>
            </div>
            <div class="w-[30px] h-[30px] flex items-center justify-center cursor-pointer group">
                <i data-lucide="x" class="w-5 h-5 text-white/30 group-hover:text-[#A61530] transition-colors"></i>
            </div>
        </div>

        <div class="w-[730px] h-[64px] flex flex-col gap-1">
            
            <div class="relative w-full h-1 flex items-center group">
                <div class="absolute w-full h-full bg-white/5 rounded-full"></div>
                <div class="absolute w-1/2 h-full bg-gradient-to-r from-[#007BFF] to-[#0056b3] rounded-full"></div>
                <div class="absolute left-1/2 -translate-x-1/2 w-3 h-3 bg-white rounded-full shadow-[-3px_0_12px_rgba(0,0,0,1)] cursor-pointer"></div>
            </div>

            <div class="w-full h-[56px] bg-white/5 rounded flex items-center justify-between px-4 shadow-[-1px_0_12px_rgba(0,0,0,1)]">
                <div class="text-white/50 text-xs">Блок 1</div>
                <div class="text-white/50 text-xs">Блок 2</div>
                <div class="text-white/50 text-xs">Блок 3</div>
            </div>
            
        </div>
    </div>

    <script>
        // Инициализация иконок
        lucide.createIcons();
    </script>
</body>
</html>
